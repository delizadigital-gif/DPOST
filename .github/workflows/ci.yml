name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgresql://dpost:dpost@localhost:5432/dpost_test
  TEST_REDIS_URL: redis://localhost:6379/1

jobs:
  check:
    name: Format, types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres and Redis for integration tests (versions match docker-compose.yml).
    services: &services
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dpost
          POSTGRES_PASSWORD: dpost
          POSTGRES_DB: dpost_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dpost -d dpost_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Receives the sign-up and password-reset emails in end-to-end tests.
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    services: *services
    env:
      DATABASE_URL: postgresql://dpost:dpost@localhost:5432/dpost_test
      REDIS_URL: redis://localhost:6379/0
      # Test-only values; production secrets live in the host's settings.
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      SMTP_URL: smtp://localhost:1025
      EMAIL_FROM: DPOST <no-reply@dpost.local>
      CONTACT_EMAIL: hello@example.test
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm --filter @dpost/web exec playwright install --with-deps chromium
      - run: pnpm --filter @dpost/web build
      - run: pnpm test:e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
