packages:
  - apps/*
  - packages/*

# pnpm blocks dependency install scripts by default; allow only what we need.
allowBuilds:
  sharp: false
  unrs-resolver: false
  esbuild: true
  # Official Prisma packages: version check and migration engine download.
  prisma: true
  '@prisma/engines': true
  # Pulled in by next-intl's build tooling. Both ship prebuilt binaries as
  # optional platform packages, so their install scripts aren't needed.
  '@parcel/watcher': false
  '@swc/core': false
